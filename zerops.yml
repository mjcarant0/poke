zerops:
  - setup: app
    build:
      base: nodejs@22
      prepareCommands:
        - sudo apk add --no-cache openssl
      buildCommands:
        - npm ci
        - npx prisma generate
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - package-lock.json
        - node_modules
        - prisma
        - next.config.mjs
    run:
      base: nodejs@22
      prepareCommands:
        - sudo apk add --no-cache openssl
      initCommands:
        - ./node_modules/.bin/prisma db push --accept-data-loss
      ports:
        - port: 3000
          httpSupport: true
      start: npm start