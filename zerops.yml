zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npx prisma generate
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - package-lock.json
        - node_modules
        - prisma
        - next.config.mjs
    run:
      base: nodejs@22
      prepareCommands:
        - npx prisma db push --skip-generate
      ports:
        - port: 3000
          httpSupport: true
      start: npm start


