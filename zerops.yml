zerops:
  - setup: app
    build:
      base: nodejs@22
      prepareCommands:
        - sudo apk add --no-cache openssl
      buildCommands:
        - npm ci
        - npx prisma generate
        - npm run build
      deployFiles:
        - .next
        - public
        - package.json
        - package-lock.json
        - node_modules
        - prisma
        - next.config.mjs
    run:
      base: nodejs@22
      prepareCommands:
        - sudo apk add --no-cache openssl
      initCommands:
        - npx prisma db push --accept-data-loss || true
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/db?schema=public
      start: npm start